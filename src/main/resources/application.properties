
spring.application.name=search-and-discovery-1
# ===============================
# H2 Database Configuration (Persistent)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/musicdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL queries in logs
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# H2 Console Enabled
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081

# tell client where Eureka server is
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.netflix.eureka.client.enabled=false
# Location of thymeleaf templates
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Enable hot reload (so you don\u2019t restart app for HTML changes)
spring.thymeleaf.cache=false

